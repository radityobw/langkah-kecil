name: Release & Export Langkah Kecil

on:
  push:
    tags:
      - "v*"
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional existing release tag (e.g., v1.1.0) to attach exported builds, SHA256SUMS.txt, and tag GHCR image"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  export:
    name: Export ${{ matrix.name }}
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.5
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android Debug APK
            preset: Android
            mode: debug
            dir: android
            out: build/android/langkah-kecil.apk
            artifact: langkah-kecil-android
            archive: langkah-kecil-android.zip
          - name: Windows Desktop
            preset: Windows Desktop
            mode: release
            dir: windows
            out: build/windows/LangkahKecil.exe
            artifact: langkah-kecil-windows
            archive: langkah-kecil-windows.zip
          - name: Linux Desktop
            preset: Linux
            mode: release
            dir: linux
            out: build/linux/LangkahKecil.x86_64
            artifact: langkah-kecil-linux
            archive: langkah-kecil-linux.zip
          - name: Web (HTML5)
            preset: Web
            mode: release
            dir: web
            out: build/web/index.html
            artifact: langkah-kecil-web
            archive: langkah-kecil-web.zip

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Godot Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates ~/.config/godot
          cp -r /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/ || true
          cp -r /root/.config/godot/* ~/.config/godot/ || true
          if [ -f /root/debug.keystore ] && [ ! -f "$HOME/debug.keystore" ]; then
            cp /root/debug.keystore "$HOME/debug.keystore" || true
          fi

      - name: Import Resources & Export ${{ matrix.preset }}
        run: |
          mkdir -p "build/${{ matrix.dir }}"
          godot --headless --path . --import
          if [ "${{ matrix.mode }}" = "debug" ]; then
            godot --headless --verbose --path . --export-debug "${{ matrix.preset }}" "${{ matrix.out }}"
          else
            godot --headless --verbose --path . --export-release "${{ matrix.preset }}" "${{ matrix.out }}"
          fi

      - name: Package Export Artifact
        run: |
          mkdir -p dist
          (cd "build/${{ matrix.dir }}" && zip -r "../../dist/${{ matrix.archive }}" .)

      - name: Upload Export Archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.archive }}

  publish:
    name: Generate Checksums & Upload Release Assets
    needs: export
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify config/version Matches Release Tag
        id: tag
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          PUSH_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          DISPATCH_TAG: ${{ inputs.release_tag }}
        run: |
          APP_VER="$(python3 -c "import re,pathlib; print(re.search(r'^config/version=\"([^\"]+)\"', pathlib.Path('project.godot').read_text(), re.M).group(1))")"
          RAW_TAG="${EVENT_TAG:-${PUSH_TAG:-$DISPATCH_TAG}}"
          echo "release_tag=$RAW_TAG" >> "$GITHUB_OUTPUT"
          if [ -n "$RAW_TAG" ]; then
            TAG_VER="${RAW_TAG#v}"
            if [ "$APP_VER" != "$TAG_VER" ]; then
              echo "project.godot config/version ($APP_VER) does not match tag ($TAG_VER)" >&2
              exit 1
            fi
          fi

      - name: Download Export Artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        run: |
          cd release-assets
          sha256sum *.zip > SHA256SUMS.txt

      - name: Create or Update GitHub Release & Upload Assets
        if: ${{ steps.tag.outputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: Langkah Kecil ${{ steps.tag.outputs.release_tag }}
          generate_release_notes: true
          files: |
            release-assets/*.zip
            release-assets/SHA256SUMS.txt

  publish-ghcr:
    name: Build & Push Web Container to ghcr.io
    needs: export
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Web Export Artifact
        uses: actions/download-artifact@v8
        with:
          name: langkah-kecil-web
          path: web-dist

      - name: Extract Web Export Bundle
        run: |
          mkdir -p build/web
          unzip -oq web-dist/langkah-kecil-web.zip -d build/web

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Image Tags
        id: meta
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          PUSH_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          DISPATCH_TAG: ${{ inputs.release_tag }}
          SHA_VAL: ${{ github.sha }}
        run: |
          RAW_TAG="${EVENT_TAG:-${PUSH_TAG:-$DISPATCH_TAG}}"
          SHORT_SHA="${SHA_VAL:0:7}"
          TAGS="ghcr.io/radityobw/langkah-kecil:latest,ghcr.io/radityobw/langkah-kecil:sha-${SHORT_SHA}"
          if [ -n "$RAW_TAG" ]; then
            CLEAN_VER="${RAW_TAG#v}"
            TAGS="${TAGS},ghcr.io/radityobw/langkah-kecil:${CLEAN_VER}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/radityobw/langkah-kecil
            org.opencontainers.image.licenses=CC-BY-NC-4.0
